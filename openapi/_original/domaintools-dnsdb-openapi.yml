      - "$ref": "#/components/parameters/humantime"
      - "$ref": "#/components/parameters/offset"
    get:
      operationId: lookupRdata
      summary: Inverse DNS lookup by rdata
      description: Lookup all resource records whose Rdata values are ...
      tags:
