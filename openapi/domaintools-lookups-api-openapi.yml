    HostingHistory:
      type: object
      description: Response for the Hosting History endpoint.
      properties:
        response:
          type: object
          properties:
            domain_name:
              type: string
              description: The queried domain name.
              example: domaintools.com
            ip_history:
              type: array
              description: 'Chronological list of IP address changes for the domain.

                '
              items:
                type: object
                properties:
                  action:
                    type: string
                    description: 'Event type code. One of: `N` (New — first observed),

                      `C` (Change — IP changed), `D` (Not Resolvable — domain

                      stopped resolving).

                      '
                    enum:
                    - N
                    - C
                    - D
                    example: C
                  action_in_words:
                    type: string
                    description: Human-readable label for the action code.
                    example: Change
                  actiondate:
                    type: string
                    description: Date the event was recorded (YYYY-MM-DD).
                    example: '2007-03-10'
                  domain:
                    type: string
                    description: The domain name associated with this event.
                    example: DOMAINTOOLS.COM
                  post_ip:
                    type: string
                    nullable: true
                    description: IP address after the change. Null or empty string when the domain became unresolvable.
                    example: 66.249.17.251
                  pre_ip:
                    type: string
                    nullable: true
                    description: IP address before the change. Null for New events.
                    example: 66.249.4.251
            nameserver_history:
              type: array
              description: 'Chronological list of nameserver changes for the domain.

                '
              items:
                type: object
                properties:
                  action:
                    type: string
                    description: 'Event type code. One of: `T` (Transfer — nameserver

                      provider changed), `N` (New), `C` (Change).

                      '
                    example: T
                  action_in_words:
                    type: string
                    description: Human-readable label for the action code.
                    example: Transfer
                  actiondate:
                    type: string
                    description: Date the event was recorded (YYYY-MM-DD).
                    example: '2020-01-11'
                  domain:
                    type: string
                    description: The domain name associated with this event.
                    example: DOMAINTOOLS.COM
                  post_mns:
                    type: string
                    description: Nameserver provider after the change.
                    example: Nsone.net
                  pre_mns:
                    type: string
                    description: Nameserver provider before the change.
                    example: Dynect.net
            registrar_history:
              type: array
              deprecated: true
              description: 'Deprecated. This field is retained for backward compatibility and always returns an empty array. Do not rely on it for new integrations.

                '
              items: {}
