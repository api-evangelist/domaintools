          items:
            $ref: '#/components/schemas/EnrichValue'
    ReverseNameServer:
      type: object
      description: Response for the Reverse Name Server endpoint.
      properties:
        response:
          type: object
          properties:
            name_server:
              type: object
              properties:
                hostname:
                  type: string
