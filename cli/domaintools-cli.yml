name: domaintools
summary: >-
  Command-line interface bundled with the official domaintools_api Python
  package. Provides quick, scriptable access to the DomainTools API product
  surface (Iris, Lookups & Monitors, Threat Feeds) from the shell.
binary_in_package: packages/domaintools-packages.yml
install:
