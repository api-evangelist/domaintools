aid: domaintools
name: DomainTools
description: >-
  DomainTools is a domain and DNS intelligence company whose APIs power threat
  investigation, hunting, and monitoring for security teams. Its product surface
  spans Iris Investigate (pivot-based domain investigation), Iris Enrich (bulk
  domain enrichment), and Iris Detect (brand-infringement monitoring); the
  Farsight DNSDB passive DNS history API (300+ billion records); Lookups &
  Monitors (WHOIS, RDAP, hosting history, reverse IP/WHOIS, reputation, risk
  score, and change monitors); Threat Feeds (predictive risk and discovery
  feeds with RPZ integration); and Farsight SIE real-time DNS event streaming.
  DomainTools publishes OpenAPI specifications, an official Python SDK with a
  bundled CLI, and a remotely hosted MCP server for AI agents. A Battery
  Ventures portfolio company, enriched into the API Evangelist network.
